<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnotes</title><style>
@font-face{font-family:Satoshi;src:url('assets/Satoshi-Variable.ttf')}*{box-sizing:border-box}body{--paper:#eeeade;--ink:#333d36;--line:#cccbbc;--muted:#7e8478;margin:0;padding:28px 32px;background:var(--paper);color:var(--ink);font:14px/1.5 Satoshi,system-ui,sans-serif;transition:background .5s,color .5s;min-height:100vh}body.dark{--paper:#202923;--ink:#e7eadf;--line:#465047;--muted:#a1aea1}header{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:650;letter-spacing:.14em}button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #8677b3;outline-offset:4px}header button{font-size:19px;width:34px;height:34px}main{max-width:380px;margin:36px auto 0}h1{font:44px/1.06 Georgia,serif;letter-spacing:-.05em;margin:0 0 14px}p{color:var(--muted);font-size:13px;margin:0 0 29px;line-height:1.7}.note{border-top:1px solid var(--line);padding:17px 0;display:flex;justify-content:space-between;gap:15px;align-items:start}.note h2{margin:0 0 6px;font-size:14px;font-weight:550}.note p{font-size:11px;margin:0;line-height:1.6}.note button{font-size:16px;opacity:.5;min-width:28px;min-height:28px}.note button:hover{opacity:1}form{display:flex;border-top:1px solid var(--line);padding-top:17px;gap:10px;align-items:center}input{background:none;border:0;min-width:0;width:100%;color:var(--ink);font:13px Satoshi;padding:10px 0}input::placeholder{color:var(--muted)}form button{border:1px solid var(--line);border-radius:20px;width:35px;height:35px;font-size:22px;flex-shrink:0}.footer{font-size:9px;color:var(--muted);margin-top:30px;display:flex;justify-content:space-between}@media(max-width:420px){body{padding:23px}main{margin-top:28px}h1{font-size:38px}}
</style></head><body><header><span>FIELDNOTES</span><button id="theme" aria-label="Toggle theme" aria-pressed="false">◐</button></header><main><h1>A place for<br>your next idea.</h1><p>Keep the thought. Come back to it later.</p><div id="notes"><article class="note"><div><h2>Leave room for the rough draft.</h2><p>Good ideas usually start as unfinished thoughts.</p></div><button aria-label="Delete Leave room for the rough draft">×</button></article><article class="note"><div><h2>Make something you want to use.</h2><p>A small beginning is still a beginning.</p></div><button aria-label="Delete Make something you want to use">×</button></article></div><form id="note-form"><input id="new-note" aria-label="New note" placeholder="Write something down…" required maxlength="180"><button aria-label="Add note">+</button></form><div class="footer"><span>Your ideas, a little less scattered.</span><span id="note-count">2 notes</span></div></main><script>
const notes=document.getElementById('notes');
const toggle=()=>{document.body.classList.toggle('dark');document.getElementById('theme').setAttribute('aria-pressed',document.body.classList.contains('dark'));};
document.getElementById('theme').onclick=()=>{toggle();parent.postMessage('theme-chosen',location.origin);};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data==='toggle-theme')toggle();if(e.data==='dark-theme'){document.body.classList.add('dark');document.getElementById('theme').setAttribute('aria-pressed','true');}});
const count=()=>document.getElementById('note-count').textContent=notes.children.length+' notes';
notes.addEventListener('click',e=>{const button=e.target.closest('button');if(button){button.closest('article').remove();count();}});
document.getElementById('note-form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('new-note');if(!input.value.trim())return;const article=document.createElement('article');article.className='note';const h=document.createElement('h2');h.textContent=input.value.trim();const box=document.createElement('div');box.append(h);const button=document.createElement('button');button.textContent='×';button.setAttribute('aria-label','Delete '+input.value.trim());article.append(box,button);notes.prepend(article);input.value='';count();});
</script></body></html>
