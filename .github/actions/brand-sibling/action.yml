name: Brand sibling
description: >-
  Clone tangle-network/brand next to this checkout and build @tangle-network/charts,
  so `file:../brand/packages/*` dependencies resolve. pnpm copies a file:
  dependency at install time, so this runs before `pnpm install`.

runs:
  using: composite
  steps:
    - name: Clone @tangle-network/brand
      shell: bash
      run: git clone --depth 1 https://github.com/tangle-network/brand.git ../brand

    # The charts package exports its built dist. It is not on npm yet, so the
    # site builds it from the same brand revision it takes tokens from.
    - name: Build @tangle-network/charts
      shell: bash
      working-directory: ../brand
      run: |
        pnpm install --frozen-lockfile --filter @tangle-network/charts
        pnpm --filter @tangle-network/charts build
