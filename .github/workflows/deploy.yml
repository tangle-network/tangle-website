name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Checkout @tangle-network/brand sibling
        run: git clone --depth 1 https://github.com/tangle-network/brand.git ../brand

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect status history
        run: node scripts/collect-status.mjs

      - name: Resolve build revision
        id: build-revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          TANGLE_BUILD_REVISION: ${{ steps.build-revision.outputs.sha }}
        run: pnpm build

      - name: Check deploy revision
        run: pnpm check:version "${{ steps.build-revision.outputs.sha }}" github-actions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=tangle-website --branch=production
