name: Public surfaces crawl

# Weekly crawl of tangle.tools, docs.tangle.tools and the Router, Sandbox and Intelligence landing pages.
# One issue, "Public surfaces drift", is created or rewritten when a link, a claim or a copy rule drifts,
# and closed when the crawl finds nothing.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: public-crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: github.ref == 'refs/heads/master'
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl the public sites
        run: node scripts/check-public.mjs live --out public-crawl.json --md public-crawl.md

      - name: Keep the crawl report
        uses: actions/upload-artifact@v4
        with:
          name: public-crawl
          path: public-crawl.json

      - name: Open, update or close the drift issue
        run: |
          title='Public surfaces drift'
          drift=$(sed -n 's/^<!-- drift:\([0-9]*\) -->$/\1/p' public-crawl.md)
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          head -c 60000 public-crawl.md > public-crawl-body.md
          if [ "${drift:-0}" -gt 0 ]; then
            if [ -n "$number" ]; then gh issue edit "$number" --body-file public-crawl-body.md; echo "updated issue #$number"
            else gh issue create --title "$title" --body-file public-crawl-body.md; fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The crawl on $(date -u +%F) found no drift."
          fi
