name: Check copy

# Full-site copy audit. Runs `pnpm check:copy` against the built site,
# chooses a rubric for each route type, and retains every route result
# as a JSON artifact. Scores below 8 fail at the 7.5 threshold.
#
# Local: `pnpm check:copy` (single page: `pnpm check:copy services/sandbox`).

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/check-copy.mjs'
      - '.github/workflows/check-copy.yml'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Checkout @tangle-network/brand sibling
        run: git clone --depth 1 https://github.com/tangle-network/brand.git ../brand

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Run copy audit
        env:
          # CI uses the repo-secret router key. Set this in
          # Settings → Secrets → Actions. The audit fails closed if this
          # credential is absent or rejected.
          TANGLE_API_KEY: ${{ secrets.TANGLE_API_KEY }}
          # Pin Luna's live OpenRouter route. The shorter aliases can remain
          # catalogued while no provider is attached to them.
          COPY_AUDIT_MODEL: ${{ vars.COPY_AUDIT_MODEL || 'openrouter/openai/gpt-5.6-luna' }}
          COPY_AUDIT_TIMEOUT_MS: ${{ vars.COPY_AUDIT_TIMEOUT_MS || '45000' }}
          COPY_AUDIT_THRESHOLD: ${{ vars.COPY_AUDIT_THRESHOLD || '7.5' }}
        run: |
          if [ -z "$TANGLE_API_KEY" ]; then
            echo "::error title=Copy audit unavailable::TANGLE_API_KEY is not configured."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t changed_files < <(
              git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            )

            only_blog_mdx=true
            if [ "${#changed_files[@]}" -eq 0 ]; then
              only_blog_mdx=false
            fi
            for file in "${changed_files[@]}"; do
              if [[ ! "$file" =~ ^src/content/blog/[^/]+\.mdx$ ]]; then
                only_blog_mdx=false
                break
              fi
            done

            if [ "$only_blog_mdx" = true ]; then
              changed_pages=(/blog)
              for file in "${changed_files[@]}"; do
                slug="${file#src/content/blog/}"
                slug="${slug%.mdx}"
                if [ -f "dist/client/blog/$slug/index.html" ]; then
                  changed_pages+=("/blog/$slug")
                fi
              done
              while IFS= read -r series_dir; do
                changed_pages+=("/blog/series/${series_dir##*/}")
              done < <(find dist/client/blog/series -mindepth 1 -maxdepth 1 -type d | sort)
              echo "Auditing changed posts plus every index that renders their metadata: ${changed_pages[*]}"
              pnpm check:copy "${changed_pages[@]}"
            else
              echo "A shared or non-blog route changed; auditing the full rendered site."
              pnpm check:copy
            fi
          else
            pnpm check:copy
          fi

      - name: Upload copy audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copy-audit-${{ github.run_attempt }}
          path: audit-results/copy-audit.json
          if-no-files-found: error
          retention-days: 30
