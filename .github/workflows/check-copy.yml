name: Check copy

# Anti-slop copywriting audit. Runs `pnpm check:copy` against the
# built site, sends each page's visible copy to a strong LLM judge,
# scores 1–10 against a strict rubric (hollow adjectives, counting
# headlines, em-dashes, mechanism-less claims, dev-tool clichés).
# Pages below the threshold fail the workflow.
#
# Local: `pnpm check:copy` (single page: `pnpm check:copy services/sandbox`).

on:
  pull_request:
    paths:
      - 'src/content/blog/**'
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'scripts/check-copy.mjs'
      - '.github/workflows/check-copy.yml'
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Checkout @tangle-network/brand sibling
        run: git clone --depth 1 https://github.com/tangle-network/brand.git ../brand

      - name: Fetch history for changed-page scope
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune --depth=2 origin "${{ github.event.pull_request.base.ref }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Run copy audit
        env:
          # CI uses the repo-secret router key. Set this in
          # Settings → Secrets → Actions. If unset we skip the
          # audit with a warning rather than failing the workflow.
          TANGLE_API_KEY: ${{ secrets.TANGLE_API_KEY }}
          # deepseek/deepseek-chat sits on the router's free-tier
          # canonical list, so per-PR audits draw no platform credits.
          # `pnpm check:models` only watches the OpenAI / Anthropic /
          # Google deprecation pages, so this id is outside its
          # coverage — if the router ever drops the model, the audit
          # fails loudly on the API call instead.
          COPY_AUDIT_MODEL: ${{ vars.COPY_AUDIT_MODEL || 'deepseek/deepseek-chat' }}
          COPY_AUDIT_THRESHOLD: ${{ vars.COPY_AUDIT_THRESHOLD || '6.5' }}
        run: |
          if [ -z "$TANGLE_API_KEY" ]; then
            echo "::warning title=Copy audit skipped::TANGLE_API_KEY secret not configured. Add it under Settings → Secrets → Actions to enable the anti-slop audit."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t changed_pages < <(
              git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'src/content/blog/*.mdx' \
                | sed -E 's#^src/content/blog/##; s#\.mdx$##; s#^#/blog/#'
            )
            if [ "${#changed_pages[@]}" -gt 0 ]; then
              echo "Auditing changed blog pages: ${changed_pages[*]}"
              pnpm check:copy "${changed_pages[@]}"
            else
              echo "No blog page changed; auditing the full rendered site."
              pnpm check:copy
            fi
          else
            pnpm check:copy
          fi
