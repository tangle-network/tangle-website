    <text x="80" y="102" fill="#f7f7ff" font-size="42" font-weight="700" letter-spacing="-1">Tangle</text>
    <text x="80" y="240" fill="#ffffff" font-size="69" font-weight="700" letter-spacing="-2">AI assistants for</text>
    <text x="80" y="320" fill="#ffffff" font-size="69" font-weight="700" letter-spacing="-2">business requests</text>
    <text x="80" y="400" fill="url(#accent)" font-size="69" font-weight="700" letter-spacing="-2">and follow-up.</text>
    <text x="80" y="515" fill="#c8cadc" font-size="25">Hospitality assistant preview</text>
    <text x="80" y="575" fill="#a5aafb" font-size="22" letter-spacing="3">TANGLE.TOOLS</text>
  </g>
