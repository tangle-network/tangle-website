<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Tangle: AI assistants for business requests and follow-up</title>
  <desc id="description">Social preview for Tangle's hospitality assistant preview.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0a0a18"/>
      <stop offset="1" stop-color="#151532"/>
    </linearGradient>
    <linearGradient id="loop" x2="1" y2="1">
      <stop stop-color="#737be9" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#a5aafb" stop-opacity=".52"/>
      <stop offset="1" stop-color="#6d72df" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#d5d7ff"/>
      <stop offset="1" stop-color="#989fff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <g fill="none" stroke="url(#loop)" stroke-width="40">
    <path d="M772 96c-177 0-182 357-20 357h282c130 0 130 140-13 140H799"/>
    <path d="M931 84h74c149 0 153 228 0 228H748c-164 0-161 221 12 221h92"/>
