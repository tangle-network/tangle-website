<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Tangle</title>
  <desc>The Tangle logo beside the homepage's illuminated indigo knot.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080814" stop-opacity="0.96" />
      <stop offset="0.43" stop-color="#080814" stop-opacity="0.72" />
      <stop offset="0.72" stop-color="#080814" stop-opacity="0.1" />
      <stop offset="1" stop-color="#080814" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#080814" />
  <image href="{{poster}}" width="1200" height="630" />
  <rect width="1200" height="630" fill="url(#shade)" />
  <image href="{{logo}}" x="48" y="194" width="560" height="226.38" />
</svg>
